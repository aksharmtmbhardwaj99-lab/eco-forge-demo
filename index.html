<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Forge | Prototype Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #07110d;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a9b8b0;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .card {
            background: #101c17;
            border: 1px solid #263c31;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.35);
        }

        video {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        .description {
            margin-top: 25px;
            color: #c6d1cb;
            line-height: 1.6;
            font-size: 16px;
        }

        .tag {
            display: inline-block;
            margin-top: 18px;
            padding: 9px 18px;
            border-radius: 30px;
            background: #183c2b;
            color: #9ce0b7;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            color: #718078;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Eco Forge</div>

    <div class="subtitle">
        Material Intelligence & Circular Recovery
    </div>

    <div class="card">

        <video controls playsinline>
            <<source src="sih video (1).mov" type="video/quicktime">>
            Your browser does not support video playback.
        </video>

        <div class="description">
            Prototype demonstration of Eco Forge —
            an AI-assisted platform for material identification,
            material intelligence and circular recovery decisions.
        </div>

        <div class="tag">
            SIH 2026 Prototype Demo
        </div>

    </div>

    <div class="footer">
        Eco Forge • Identify. Understand. Recover.
    </div>

</div>

</body>
</html>
